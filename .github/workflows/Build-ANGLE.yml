name: ANGLE 进阶构建流水线

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'doc/**'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'doc/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建类型
        type: choice
        required: true
        default: Release
        options:
          - Release
          - Debug
      target_arch:
        description: 目标架构
        type: choice
        required: true
        default: x64
        options:
          - x64
          - arm64
      enable_vulkan:
        description: 启用 Vulkan 渲染后端
        type: boolean
        required: false
        default: true
      run_tests:
        description: 构建完成后运行单元测试
        type: boolean
        required: false
        default: false
      build_platforms:
        description: 构建平台
        type: choice
        required: true
        default: all
        options:
          - all
          - ubuntu
          - windows
          - macos

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      os_matrix: ${{ steps.set_matrix.outputs.os_matrix }}
    steps:
      - id: set_matrix
        shell: bash
        run: |
          if [ "${{ github.event.inputs.build_platforms }}" = "all" ] || [ -z "${{ github.event.inputs.build_platforms }}" ]; then
            os_list='["ubuntu-latest", "windows-latest", "macos-latest"]'
          else
            os_list="[\"${{ github.event.inputs.build_platforms }}-latest\"]"
          fi
          echo "os_matrix=$os_list" >> $GITHUB_OUTPUT

  build:
    needs: generate-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.generate-matrix.outputs.os_matrix) }}

    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'Release' }}
      TARGET_ARCH: ${{ github.event.inputs.target_arch || 'x64' }}
      ENABLE_VULKAN: ${{ github.event.inputs.enable_vulkan || true }}
      RUN_TESTS: ${{ github.event.inputs.run_tests || false }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 缓存 depot_tools
        uses: actions/cache@v4
        id: cache-depot-tools
        with:
          path: depot_tools
          key: ${{ runner.os }}-depot-tools

      - name: 安装 depot_tools (Linux/macOS)
        if: runner.os != 'Windows' && steps.cache-depot-tools.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" >> $GITHUB_PATH

      - name: 安装 depot_tools (Windows)
        if: runner.os == 'Windows' && steps.cache-depot-tools.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" >> $GITHUB_PATH

      - name: 将 depot_tools 加入环境变量
        shell: bash
        run: echo "$PWD/depot_tools" >> $GITHUB_PATH

      # 关键修复：跳过私有内部子模块，仅初始化公开子模块
      - name: 初始化公开子模块
        shell: bash
        run: |
          git submodule init
          # 卸载指向谷歌内部仓库的子模块
          git submodule deinit -f third_party/gles1_conform 2>/dev/null || true
          # 更新其余公开子模块
          git submodule update --init --recursive --recommend-shallow

      # 关键修复：配置 gclient 并跳过内部私有依赖
      - name: 同步公开项目依赖
        shell: bash
        run: |
          gclient config --name . --unmanaged https://github.com/3548077732/angle.git
          # 排除内部受限依赖，仅拉取公开可访问的依赖
          gclient sync --nohooks --no-history \
            --custom-deps='third_party/gles1_conform@None'

      - name: 执行 gclient hooks
        shell: bash
        run: gclient runhooks

      - name: 拼接 GN 构建参数（分平台适配）
        shell: bash
        id: gn_args
        run: |
          IS_DEBUG="false"
          if [ "$BUILD_TYPE" = "Debug" ]; then
            IS_DEBUG="true"
          fi

          GN_ARGS="is_debug=${IS_DEBUG} target_cpu=\"${TARGET_ARCH}\" is_component_build=true"
          GN_ARGS="${GN_ARGS} angle_enable_vulkan=${ENABLE_VULKAN}"

          if [ "$RUNNER_OS" = "Windows" ]; then
            GN_ARGS="${GN_ARGS} angle_enable_d3d9=true angle_enable_d3d11=true"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            GN_ARGS="${GN_ARGS} angle_enable_metal=true angle_enable_gl=false"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            GN_ARGS="${GN_ARGS} angle_enable_gl=true"
          fi

          echo "args=${GN_ARGS}" >> $GITHUB_OUTPUT

      - name: 生成 Ninja 构建配置
        shell: bash
        run: gn gen out/${{ env.BUILD_TYPE }} --args='${{ steps.gn_args.outputs.args }}'

      - name: 执行编译
        shell: bash
        run: ninja -C out/${{ env.BUILD_TYPE }} -j $(( $(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4) ))

      - name: 运行单元测试（可选，仅 x64）
        if: env.RUN_TESTS == 'true' && env.TARGET_ARCH == 'x64'
        shell: bash
        run: |
          cd out/${{ env.BUILD_TYPE }}
          ./angle_unittests

      - name: 打包核心构建产物
        shell: bash
        run: |
          mkdir -p artifact-${RUNNER_OS}-${TARGET_ARCH}-${BUILD_TYPE}
          cp out/${BUILD_TYPE}/libGLESv2.* artifact-${RUNNER_OS}-${TARGET_ARCH}-${BUILD_TYPE}/ 2>/dev/null || true
          cp out/${BUILD_TYPE}/libEGL.* artifact-${RUNNER_OS}-${TARGET_ARCH}-${BUILD_TYPE}/ 2>/dev/null || true
          cp out/${BUILD_TYPE}/angleinfo* artifact-${RUNNER_OS}-${TARGET_ARCH}-${BUILD_TYPE}/ 2>/dev/null || true

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: angle-${{ runner.os }}-${{ env.TARGET_ARCH }}-${{ env.BUILD_TYPE }}-${{ github.sha }}
          path: artifact-${{ runner.os }}-${{ env.TARGET_ARCH }}-${{ env.BUILD_TYPE }}/
